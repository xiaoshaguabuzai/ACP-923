# ═══ Gradle 性能 ═══
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
# 【重点】你现在网络经常 Connection reset，并行拉依赖容易并发超时，先关掉
org.gradle.parallel=false
#org.gradle.configuration-cache=true
org.gradle.configuration-cache=false

org.gradle.configuration-cache.problems=warn
kotlin.daemon.jvmargs=-Xmx4g
# Gradle 9.4+ IDE 并行同步
org.gradle.tooling.parallel=true

# JDK 路径，暂时注释，优先让Android Studio IDE接管Gradle JDK，避免终端/IDE两套JDK冲突
#org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# 【新增】网络超时，解决 Connection reset
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# ═══ Android ═══
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9.1.0 官方只测到 compileSdk 36.1，此处用 37，抑制版本警告
android.suppressUnsupportedCompileSdk=37.0

# ═══ Kotlin / KMP ═══
kotlin.mpp.stability.nowarn=true
kotlin.incremental=true
# iOS 模拟器测试任务在 Windows 上不可用，忽略该警告
kotlin.native.ignoreDisabledTargets=true

# ═══ Compose Hot Reload（可选）═══
# 需要 JetBrains Runtime 21。JBR 自动下载通道被网络阻断时，手动装到 ~/.jdks/jbr-21
# 然后取消下一行注释即可启用 Desktop 热重载：
# compose.reload.jbr.binary=C:\\Users\\Administrator\\.jdks\\jbr-21\\bin\\java.exe

