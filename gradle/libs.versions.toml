# ACP-923 版本目录 —— 常用依赖与插件的稳定版本统一在这里管理。
#
# 三条纪律（详见 docs/ARCHITECTURE.md 第 8 节）：
# 1. 模块与约定插件只能通过 libs.* 访问依赖，任何地方都不许再写裸版本号；
# 2. 同类版本成组升级：AGP ↔ Kotlin ↔ Compose MP ↔ composeCompiler 是耦合的，
#    Koin ↔ Ktor 也常成对（Koin 的 ktor 集成依赖 Ktor 版本）；
# 3. 升级前先在练习项目里单独验证，再改这里 —— 改完必须四平台都能编译。
# 版本来源：CMP 各项目（kotlinconf-app / Shopping-By-KMP）在本机实际跑通的最新稳定版。

[versions]
agp = "9.3.0"
kotlin = "2.4.10"
composeMultiplatform = "1.12.0"
# material3 换成适配 CM 1.12.0 的alpha版
compose-material3 = "1.12.0-alpha03"

# ── Android 配置 ──
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
android-versionCode = "1"
android-versionName = "1.0"

# ── AndroidX / Jetbrains Multiplatform ──
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
androidx-lifecycle = "2.11.0-beta01"   # org.jetbrains.androidx.lifecycle（KMP 版）
compose-navigation = "2.9.0"           # org.jetbrains.androidx.navigation（KMP 版）

# ── KotlinX ──
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"

# ── 网络与 DI ──
ktor = "3.5.1"
koin = "4.2.2"                         # koin-core / koin-android
koin-compose = "4.2.2"                 # koin-compose / koin-compose-viewmodel（版本已验证）

# ── 图片 / KV 存储 ──
coil = "3.6.0"
multiplatform-settings = "1.3.0"

# ── 测试与工具 ──
junit = "4.13.2"
ktlint = "12.1.2"

[libraries]
# ── KotlinX ──
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# ── Compose Multiplatform ──
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.components:components-ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# ── AndroidX / KMP lifecycle & navigation ──
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "compose-navigation" }

# ── Ktor Client（全平台）──
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }    # Android / Desktop
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }    # iOS
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }            # Web (js/wasmJs)
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }        # 测试

# ── Koin（按需启用，版本已锁定）──
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin-compose" }

# ── Coil 3（全平台图片加载）──
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# ── KV 存储（DataStore 的 KMP 替代）──
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings" }

# ── 测试 ──
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

[bundles]
compose = [
    "compose-runtime", "compose-foundation", "compose-material3",
    "compose-ui-tooling-preview", "compose-components-resources",
]
ktor-client = [
    "ktor-client-core", "ktor-client-logging",
    "ktor-client-content-negotiation", "ktor-serialization-json",
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinParcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

# ── 本项目约定插件（build-logic 里实现）──
acpKmpLibrary = { id = "acp.kmp.library", version = "unspecified" }
acpAndroidApp = { id = "acp.android.app", version = "unspecified" }
